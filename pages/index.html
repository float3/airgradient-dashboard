<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Wall dashboards</title>
<style>
  :root { --bg: #111418; --card: #1b2026; --text: #e6edf3; --muted: #8b949e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font-family: "DejaVu Sans", system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 48px 22px; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 6px; }
  p { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  a.panel { display: block; background: var(--card); border-radius: 10px; padding: 16px 18px;
    color: var(--text); text-decoration: none; font-size: 19px; }
  a.panel span { display: block; font-size: 14px; color: var(--muted); margin-top: 3px; }
  a.panel.off { opacity: 0.45; pointer-events: none; }
</style>
</head>
<body>
<main>
  <h1>Wall dashboards</h1>
  <p>Each panel is a full-screen page meant for a display across the room.</p>
  <ul id="list"></ul>
</main>
<script>
const PANELS = [
  ["air", "Air quality", "PM, CO₂, temperature, humidity, TVOC and NOx, with an alarm"],
  ["weather", "Weather", "Now, daylight, rain timeline and the days ahead"],
  ["transit", "Departures", "Realtime departures for the configured stops"],
];
fetch("/panels", { cache: "no-store" })
  .then(r => r.json())
  .then(on => {
    document.getElementById("list").innerHTML = PANELS.map(([key, name, blurb]) =>
      `<li><a class="panel ${on[key] ? "" : "off"}" href="/${key}">${name}
        <span>${on[key] ? blurb : "not configured on this host"}</span></a></li>`).join("");
  })
  .catch(() => {
    document.getElementById("list").innerHTML = "<li>service unreachable</li>";
  });
</script>
</body>
</html>
