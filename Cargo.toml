[package]
name = "wall-dashboards"
version = "0.2.0"
edition = "2021"
description = "Air quality, weather and departure panels for a wall display"
homepage = "https://github.com/float3/wall-dashboards"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# TLS is needed: the air sensor is plain HTTP on the LAN, but the weather and
# departure feeds are both HTTPS.
ureq = "2"

[profile.release]
lto = true
strip = true
