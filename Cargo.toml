[package]
name = "airgradient-dashboard"
version = "0.1.0"
edition = "2021"
description = "Local history, charts and an out-of-range alarm for an AirGradient monitor"
homepage = "https://github.com/float3/airgradient-dashboard"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
# The monitor is on the LAN and speaks plain HTTP, so the TLS stack that ureq
# pulls in by default would be dead weight in the closure.
ureq = { version = "2", default-features = false }

[profile.release]
lto = true
strip = true
